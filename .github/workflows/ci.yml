name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
#<GENERATE_BEGIN>
  sim_basic:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: sim_basic

  lint_ghdl:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl

  lint_ghdl_synth_default:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_default

  lint_ghdl_synth_duty50_ratio4:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_duty50_ratio4

  lint_ghdl_synth_duty50_ratio5:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_duty50_ratio5

  lint_ghdl_synth_pulse_ratio1:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_pulse_ratio1

  lint_ghdl_synth_pulse_ratio5:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: lint_ghdl_synth_pulse_ratio5

  syn_default:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_default

  syn_duty50_ratio4:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_duty50_ratio4

  syn_duty50_ratio5:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_duty50_ratio5

  syn_pulse_ratio1:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_pulse_ratio1

  syn_pulse_ratio5:
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      name: syn_pulse_ratio5

  badges:
    needs: [sim_basic, lint_ghdl, lint_ghdl_synth_default, lint_ghdl_synth_duty50_ratio4, lint_ghdl_synth_duty50_ratio5, lint_ghdl_synth_pulse_ratio1, lint_ghdl_synth_pulse_ratio5, syn_default, syn_duty50_ratio4, syn_duty50_ratio5, syn_pulse_ratio1, syn_pulse_ratio5]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: deuskane/asylum-ci/.github/workflows/badges.yml@main
    with:
      results: ${{ toJSON(needs) }}

#<GENERATE_END>
